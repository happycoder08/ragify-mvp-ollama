name: RAG Evaluation

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      APP_MODE: ci
      LLM_PROVIDER: mock
      RAGIFY_MOCK: "1"
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Seed evaluation corpus
      run: |
        python scripts/seed_corpus.py
        
    - name: Run Evaluation
      run: |
        make eval > eval_output.txt 2>&1
        cat eval_output.txt
        
    - name: Upload Eval Results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: eval-results
        path: eval_output.txt
